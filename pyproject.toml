[project]
name = "f88tball"
version = "0.1.0"
description = "Automated football (FIFA World Cup 2026) highlight-video generator for YouTube, built with LLMs, LangChain/LangGraph and free-tier AI services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- Web API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    # --- Config / HTTP ---
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "json-repair>=0.30.0",
    # --- LLM frameworks (orchestration) ---
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-supervisor>=0.0.9",
    "langsmith>=0.1.0",
    # --- LLM providers ---
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-cerebras>=0.5.0",
    "langchain-ollama>=0.2.0",
    # --- Voice / Video ---
    "edge-tts>=7.0.0",
    "gtts>=2.5.0",
    "moviepy>=1.0.3",
    "pillow>=10.4.0",
    "pysrt>=1.1.2",
    # --- YouTube upload (OAuth) ---
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    # --- RAG (advanced/expert levels) ---
    "langchain-huggingface>=0.1.0",
    "langchain-chroma>=0.1.4",
    "sentence-transformers>=3.0.0",
    "arxiv>=2.1.0",
    "pymupdf>=1.24.0",
    "networkx>=3.3",
    "langchain-experimental>=0.3.0",
    # --- Finance news (advanced level) ---
    "finnhub-python>=2.4.20",
    "yfinance>=0.2.40",
    # --- Scheduler ---
    "apscheduler>=3.10.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
