services:

  # ──────────────────────────────────────────────
  # Backend — FastAPI (port 5001)
  # ──────────────────────────────────────────────
  backend:
    build: .
    container_name: f88tball-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - ./profiles:/app/profiles      # per-profile config, tokens, output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────
  # Frontend — React build served by nginx (port 80)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: f88tball-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

networks:
  default:
    name: f88tball-net
